<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">BCIFeatR cover</title>
  <desc id="desc">EEG trials flow through a unified train/test API into feature families, fitted objects, and feature matrices.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbfa"/>
      <stop offset="100%" stop-color="#eef4f2"/>
    </linearGradient>
    <filter id="soft-shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102326" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#44636a"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#panel)"/>
  <path d="M0 418 C150 384 238 442 390 405 C555 365 650 282 824 321 C992 358 1062 284 1200 247 L1200 520 L0 520 Z" fill="#dfece8"/>
  <path d="M0 82 C150 118 236 44 381 82 C531 121 599 186 762 147 C922 109 1045 82 1200 128" fill="none" stroke="#d7e5e1" stroke-width="18" stroke-linecap="round"/>

  <g transform="translate(64 66)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" fill="#102326">BCIFeatR</text>
    <text x="2" y="42" font-family="Inter, Arial, sans-serif" font-size="22" fill="#3b555a">Feature extraction toolkit for EEG-based brain-computer interfaces in R</text>
  </g>

  <g transform="translate(72 168)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="230" height="210" rx="18" fill="#ffffff"/>
    <text x="24" y="40" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#102326">EEG trials</text>
    <text x="24" y="70" font-family="Inter, Arial, sans-serif" font-size="14" fill="#536b70">samples x channels</text>
    <g transform="translate(22 96)" fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M0 38 C20 38 18 8 38 8 C58 8 56 68 76 68 C96 68 95 22 114 22 C133 22 132 50 152 50 C172 50 168 28 186 28" stroke="#197b75"/>
      <path d="M0 82 C16 82 20 58 38 58 C56 58 58 101 78 101 C98 101 99 72 118 72 C137 72 139 89 158 89 C177 89 170 67 186 67" stroke="#d1793a"/>
    </g>
    <g transform="translate(26 174)">
      <rect x="0" y="0" width="46" height="14" rx="7" fill="#dceeea"/>
      <rect x="58" y="0" width="46" height="14" rx="7" fill="#f2dfd0"/>
      <rect x="116" y="0" width="46" height="14" rx="7" fill="#e4e0f3"/>
    </g>
  </g>

  <line x1="325" y1="274" x2="403" y2="274" stroke="#44636a" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(428 132)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="344" height="286" rx="18" fill="#ffffff"/>
    <text x="28" y="42" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#102326">Unified train/test API</text>
    <text x="28" y="72" font-family="Inter, Arial, sans-serif" font-size="14" fill="#536b70">fit once, transform held-out trials deterministically</text>

    <g transform="translate(28 108)">
      <rect x="0" y="0" width="288" height="42" rx="10" fill="#eef7f5"/>
      <text x="18" y="27" font-family="Menlo, Consolas, monospace" font-size="17" fill="#155e59">feat_ex_train(x, y, feature)</text>
    </g>
    <g transform="translate(28 166)">
      <rect x="0" y="0" width="288" height="42" rx="10" fill="#fff3eb"/>
      <text x="18" y="27" font-family="Menlo, Consolas, monospace" font-size="17" fill="#8a4b18">feat_ex_test(x_new, object)</text>
    </g>

    <g transform="translate(30 237)" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">
      <rect x="0" y="-20" width="58" height="28" rx="14" fill="#dceeea"/>
      <text x="14" y="-1" fill="#155e59">CSP</text>
      <rect x="70" y="-20" width="70" height="28" rx="14" fill="#e4e0f3"/>
      <text x="84" y="-1" fill="#574f86">FBCSP</text>
      <rect x="152" y="-20" width="42" height="28" rx="14" fill="#e6edf4"/>
      <text x="166" y="-1" fill="#365b78">TS</text>
      <rect x="206" y="-20" width="88" height="28" rx="14" fill="#f2dfd0"/>
      <text x="220" y="-1" fill="#8a4b18">MVAR</text>
    </g>
  </g>

  <line x1="795" y1="274" x2="873" y2="274" stroke="#44636a" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(900 168)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="230" height="210" rx="18" fill="#ffffff"/>
    <text x="24" y="40" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#102326">Outputs</text>
    <text x="24" y="70" font-family="Inter, Arial, sans-serif" font-size="14" fill="#536b70">features + fitted object</text>

    <g transform="translate(24 96)">
      <rect x="0" y="0" width="84" height="72" rx="10" fill="#eef3f7"/>
      <g fill="#6f8792">
        <rect x="14" y="14" width="14" height="14" rx="3"/>
        <rect x="36" y="14" width="14" height="14" rx="3"/>
        <rect x="58" y="14" width="14" height="14" rx="3"/>
        <rect x="14" y="36" width="14" height="14" rx="3"/>
        <rect x="36" y="36" width="14" height="14" rx="3"/>
        <rect x="58" y="36" width="14" height="14" rx="3"/>
      </g>
      <text x="102" y="27" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#102326">feature matrix</text>
      <text x="102" y="51" font-family="Inter, Arial, sans-serif" font-size="13" fill="#536b70">trials x features</text>
    </g>
    <g transform="translate(24 181)">
      <circle cx="8" cy="0" r="5" fill="#197b75"/>
      <text x="22" y="5" font-family="Inter, Arial, sans-serif" font-size="13" fill="#536b70">classifiers, MCCA, validation</text>
    </g>
  </g>

  <g transform="translate(73 430)" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3b555a">
    <text x="0" y="0">log-variance | filter-bank CSP | tangent space | Riemannian geometry | ATM | Hjorth | MVAR | MSVAR</text>
  </g>
</svg>
